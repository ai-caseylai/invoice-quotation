<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔍 檢查當前位置</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            padding: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #667eea;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        pre {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            overflow-x: auto;
            border-left: 4px solid #667eea;
        }
        .comparison {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 30px;
        }
        .column {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
        }
        .column h3 {
            margin-top: 0;
            color: #667eea;
        }
        .error {
            background: #fee;
            color: #c00;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }
        .success {
            background: #dfd;
            color: #070;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }
        .warning {
            background: #ffc;
            color: #660;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }
        .btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
            margin-right: 10px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .btn-danger {
            background: linear-gradient(135deg, #f5576c 0%, #f093fb 100%);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background: #667eea;
            color: white;
        }
        .wrong {
            background: #ffebee;
            color: #c62828;
            font-weight: bold;
        }
        .correct {
            background: #e8f5e9;
            color: #2e7d32;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 檢查 Supabase 當前位置數據</h1>
        <p class="subtitle">查看當前儲存的元件位置是否正確</p>

        <button class="btn" onclick="checkPositions()">🔄 載入當前位置</button>
        <button class="btn btn-danger" onclick="window.open('fix-positions-now.html', '_blank')">🔧 開啟修復工具</button>

        <div id="result"></div>
    </div>

    <script>
        const supabase = window.supabase.createClient(
            CONFIG.SUPABASE.URL,
            CONFIG.SUPABASE.ANON_KEY
        );

        const CORRECT_POSITIONS = {
            'logo': { left: 40 },
            'company-info': { left: 555 },  // 右對齊
            'title': { left: 297.5 },        // 居中
            'separator-line': { left: 40 },
            'invoice-info': { left: 40 },
            'customer-info': { left: 555 },  // 右對齊
            'customer-detail': { left: 40 },
            'items-table': { left: 40 },
            'total': { left: 555 },          // 右對齊
            'notes': { left: 40 }
        };

        async function checkPositions() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>⏳ 載入中...</p>';

            try {
                const { data, error } = await supabase
                    .from('pdf_element_positions')
                    .select('*')
                    .order('updated_at', { ascending: false })
                    .limit(1);

                if (error) throw error;

                if (!data || data.length === 0) {
                    resultDiv.innerHTML = '<div class="error">❌ Supabase 中沒有位置數據！<br>請先使用修復工具初始化位置。</div>';
                    return;
                }

                const positions = data[0].positions;
                const updatedAt = new Date(data[0].updated_at).toLocaleString('zh-HK');

                console.log('當前位置:', positions);

                let html = `<div class="success">✅ 成功載入位置數據<br>最後更新: ${updatedAt}</div>`;

                // 比較表格
                html += '<h3>📊 位置對比</h3>';
                html += '<table>';
                html += '<tr><th>元件</th><th>當前 left (px)</th><th>正確值</th><th>狀態</th><th>差距</th></tr>';

                let hasErrors = false;
                let errorCount = 0;

                for (const [key, correctPos] of Object.entries(CORRECT_POSITIONS)) {
                    const current = positions[key];
                    
                    if (!current) {
                        html += `<tr class="wrong">
                            <td><code>${key}</code></td>
                            <td>❌ 缺失</td>
                            <td>${correctPos.left}px</td>
                            <td>未設定</td>
                            <td>-</td>
                        </tr>`;
                        hasErrors = true;
                        errorCount++;
                        continue;
                    }

                    const diff = Math.abs(current.left - correctPos.left);
                    const isCorrect = diff < 5;
                    const rowClass = isCorrect ? 'correct' : 'wrong';
                    const status = isCorrect ? '✅ 正確' : '❌ 錯誤';

                    if (!isCorrect) {
                        hasErrors = true;
                        errorCount++;
                    }

                    html += `<tr class="${rowClass}">
                        <td><code>${key}</code></td>
                        <td>${current.left}px</td>
                        <td>${correctPos.left}px</td>
                        <td>${status}</td>
                        <td>${diff.toFixed(1)}px</td>
                    </tr>`;
                }

                html += '</table>';

                if (hasErrors) {
                    html += `<div class="warning">
                        ⚠️ 發現 ${errorCount} 個位置錯誤！<br><br>
                        <strong>解決方法：</strong><br>
                        1. 點擊上方的 "🔧 開啟修復工具" 按鈕<br>
                        2. 在新視窗點擊 "立即修復位置"<br>
                        3. 回到這裡重新檢查<br>
                        4. 重新生成 PDF 測試
                    </div>`;
                } else {
                    html += '<div class="success">🎉 所有位置都正確！可以生成 PDF 測試了。</div>';
                }

                // 顯示完整 JSON
                html += '<h3>📄 完整位置數據 (JSON)</h3>';
                html += '<pre>' + JSON.stringify(positions, null, 2) + '</pre>';

                resultDiv.innerHTML = html;

            } catch (error) {
                console.error('檢查失敗:', error);
                resultDiv.innerHTML = `<div class="error">❌ 檢查失敗: ${error.message}</div>`;
            }
        }

        // 自動載入
        window.addEventListener('load', checkPositions);
    </script>
</body>
</html>
