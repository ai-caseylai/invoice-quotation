<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>發票&報價單生成器</title>
    <link rel="stylesheet" href="style.css">
    <style>
        #loginOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex; align-items: center; justify-content: center; z-index: 9999;
        }
        #loginBox {
            background: #fff; padding: 40px; border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2); text-align: center; max-width: 380px; width: 90%;
        }
        #loginBox h2 { font-size: 22px; color: #333; margin-bottom: 6px; }
        #loginBox p { color: #888; margin-bottom: 20px; font-size: 14px; }
        #loginBox input {
            width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px;
            font-size: 16px; margin-bottom: 12px; outline: none; text-align: center;
        }
        #loginBox button {
            width: 100%; padding: 12px; background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer;
        }
        #loginError { color: #e53e3e; margin-top: 10px; display: none; font-size: 13px; }
    </style>
</head>
<body>
    <div id="loginOverlay">
        <div id="loginBox">
            <h2>📄 發票 & 報價單生成器</h2>
            <p>請輸入密碼以繼續</p>
            <input type="password" id="loginPassword" placeholder="密碼" onkeydown="if(event.key==='Enter')doLogin()">
            <button onclick="doLogin()">登入</button>
            <p id="loginError">密碼錯誤</p>
        </div>
    </div>

    <div id="appContent" style="display:none">
    <div class="container">
        <h1>📄 發票 & 報價單生成器</h1>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('invoice')">發票</button>
            <button class="tab-btn" onclick="switchTab('quotation')">報價單</button>
        </div>

        <div class="form-container">
            <div class="section">
                <h2>公司資訊</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label>公司名稱</label>
                        <input type="text" id="companyName" value="示例科技有限公司">
                    </div>
                    <div class="form-group">
                        <label>聯絡電話</label>
                        <input type="text" id="companyPhone" value="2123-4567">
                    </div>
                    <div class="form-group">
                        <label>公司地址</label>
                        <input type="text" id="companyAddress" value="香港中環皇后大道中123號">
                    </div>
                    <div class="form-group">
                        <label>電子郵箱</label>
                        <input type="email" id="companyEmail" value="contact@example.com">
                    </div>
                </div>
            </div>

            <div class="section">
                <h2>客戶資訊</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label>客戶名稱</label>
                        <input type="text" id="customerName" value="客戶公司名稱">
                    </div>
                    <div class="form-group">
                        <label>聯絡人</label>
                        <input type="text" id="customerContact" value="張三">
                    </div>
                    <div class="form-group">
                        <label>聯絡電話</label>
                        <input type="text" id="customerPhone" value="9123-4567">
                    </div>
                    <div class="form-group">
                        <label id="docNumberLabel">發票編號</label>
                        <input type="text" id="docNumber" value="INV-2024-001">
                    </div>
                </div>
            </div>

            <div class="section">
                <h2>項目明細</h2>
                <div id="itemsContainer">
                    <div class="item-row">
                        <input type="text" placeholder="項目名稱" value="網站開發服務">
                        <input type="number" placeholder="數量" value="1">
                        <input type="number" placeholder="單價" value="50000">
                        <button class="btn-remove" onclick="removeItem(this)">刪除</button>
                    </div>
                </div>
                <button class="btn-add" onclick="addItem()">+ 新增項目</button>
            </div>

            <div class="section">
                <h2>備註資訊</h2>
                <textarea id="notes" rows="3" placeholder="請填寫備註資訊...">付款方式：銀行轉賬
有效期：30天</textarea>
            </div>

            <div class="button-group">
                <button class="btn-primary" onclick="generatePDF()">生成PDF</button>
                <button class="btn-secondary" onclick="resetForm()">重置表單</button>
            </div>
        </div>
    </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="font.js"></script>
    <script src="script.js"></script>
    <script>
        // 密碼保護
        (function() {
            if (sessionStorage.getItem('inv_auth')) {
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('appContent').style.display = '';
                return;
            }
            document.getElementById('appContent').style.display = 'none';
        })();
        function doLogin() {
            var pw = document.getElementById('loginPassword').value;
            if (pw === 'admin888') {
                sessionStorage.setItem('inv_auth', '1');
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('appContent').style.display = '';
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        }
    </script>

    <!-- Qwen3 Chatbot -->
    <style>
        #chatToggle { position: fixed; bottom: 20px; right: 20px; width: 56px; height: 56px;
            background: linear-gradient(135deg,#667eea,#764ba2); color: #fff; border: none;
            border-radius: 50%; font-size: 24px; cursor: pointer; z-index: 9998;
            box-shadow: 0 4px 20px rgba(102,126,234,0.4); }
        #chatPanel { position: fixed; top: 0; right: 0; width: 380px; height: 100vh;
            background: #fff; box-shadow: -2px 0 20px rgba(0,0,0,0.1); z-index: 9999;
            display: none; flex-direction: column; }
        #chatPanel.open { display: flex; }
        #chatHeader { padding: 16px; background: linear-gradient(135deg,#667eea,#764ba2);
            color: #fff; display: flex; justify-content: space-between; align-items: center; }
        #chatHeader button { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; }
        #chatMessages { flex: 1; overflow-y: auto; padding: 16px; }
        #chatMessages .msg { margin-bottom: 12px; padding: 10px 14px; border-radius: 12px;
            max-width: 85%; word-wrap: break-word; font-size: 14px; line-height: 1.5; }
        #chatMessages .msg.user { background: #667eea; color: #fff; margin-left: auto; }
        #chatMessages .msg.assistant { background: #f0f0f0; color: #333; }
        #chatInputArea { padding: 12px; border-top: 1px solid #eee; display: flex; gap: 8px; }
        #chatInputArea input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px;
            font-size: 14px; outline: none; }
        #chatInputArea button { padding: 10px 16px; background: #667eea; color: #fff;
            border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
        .typing { color: #888; font-style: italic; padding: 10px 14px; font-size: 13px; }
    </style>

    <button id="chatToggle" onclick="toggleChat()">💬</button>
    <div id="chatPanel">
        <div id="chatHeader">
            <span>🤖 AI 助手 (Qwen3)</span>
            <button onclick="toggleChat()">✕</button>
        </div>
        <div id="chatMessages"></div>
        <div id="chatInputArea">
            <input type="text" id="chatInput" placeholder="輸入訊息，或要求修改表單..." onkeydown="if(event.key==='Enter')sendChat()">
            <button onclick="sendChat()">發送</button>
        </div>
    </div>

    <script>
        let chatSessionId = null;

        function toggleChat() {
            const p = document.getElementById('chatPanel');
            p.classList.toggle('open');
        }

        function getFormState() {
            return {
                companyName: document.getElementById('companyName')?.value || '',
                companyPhone: document.getElementById('companyPhone')?.value || '',
                companyAddress: document.getElementById('companyAddress')?.value || '',
                companyEmail: document.getElementById('companyEmail')?.value || '',
                customerName: document.getElementById('customerName')?.value || '',
                customerContact: document.getElementById('customerContact')?.value || '',
                customerPhone: document.getElementById('customerPhone')?.value || '',
                docNumber: document.getElementById('docNumber')?.value || '',
                notes: document.getElementById('notes')?.value || '',
            };
        }

        function setFormField(field, value) {
            const el = document.getElementById(field);
            if (el) { el.value = value; return true; }
            return false;
        }

        function addChatMsg(role, text) {
            const div = document.createElement('div');
            div.className = 'msg ' + role;
            div.textContent = text;
            document.getElementById('chatMessages').appendChild(div);
            document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight;
        }

        async function sendChat() {
            const input = document.getElementById('chatInput');
            const msg = input.value.trim();
            if (!msg) return;
            input.value = '';
            addChatMsg('user', msg);

            const typing = document.createElement('div');
            typing.className = 'typing';
            typing.textContent = '思考中...';
            document.getElementById('chatMessages').appendChild(typing);

            try {
                const resp = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: msg, sessionId: chatSessionId, formState: getFormState() }),
                });
                const data = await resp.json();
                typing.remove();

                if (data.error) { addChatMsg('assistant', '❌ ' + data.error); return; }

                chatSessionId = data.sessionId;
                const reply = data.reply.replace(/```action[\s\S]*?```/g, '').trim();
                if (reply) addChatMsg('assistant', reply);

                // Apply form modifications
                if (data.action?.setFields) {
                    for (const [k, v] of Object.entries(data.action.setFields)) {
                        if (setFormField(k, v as string)) addChatMsg('assistant', '✅ 已更新：' + k);
                    }
                }
                if (data.action?.setItems) {
                    const container = document.getElementById('itemsContainer');
                    if (container) {
                        container.innerHTML = '';
                        for (const item of data.action.setItems) {
                            const row = document.createElement('div');
                            row.className = 'item-row';
                            row.innerHTML = `<input type="text" placeholder="項目名稱" value="${item.name||''}">
                                <input type="number" placeholder="數量" value="${item.qty||item.quantity||1}">
                                <input type="number" placeholder="單價" value="${item.price||item.unit_price||0}">
                                <button class="btn-remove" onclick="removeItem(this)">刪除</button>`;
                            container.appendChild(row);
                        }
                        addChatMsg('assistant', '✅ 已更新項目列表');
                    }
                }
            } catch (e) {
                typing.remove();
                addChatMsg('assistant', '❌ 連線失敗: ' + e.message);
            }
        }
    </script>
</body>
</html>
